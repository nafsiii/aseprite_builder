name: Build Aseprite for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  BUILD_TYPE: Release
  SKIA_VERSION: m124-08a5439a6b

jobs:
  build-aseprite:
    name: Build Aseprite (Windows)
    runs-on: windows-latest

    permissions:
      contents: read
      actions: write

    steps:

      # ---------------------------------------------------------
      # 1. Download the latest Aseprite source release
      # ---------------------------------------------------------
      - name: Get latest Aseprite release
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aseprite/aseprite/releases/latest"

          $tag = $release.tag_name
          $sourceUrl = ($release.assets |
            Where-Object { $_.name -like "*-Source.zip" }).browser_download_url

          if (-not $sourceUrl) {
            throw "Could not find the Aseprite source ZIP."
          }

          Write-Host "Aseprite version: $tag"
          Write-Host "Source URL: $sourceUrl"

          "ASEPRITE_VERSION=$tag" >> $env:GITHUB_ENV
          "ASEPRITE_SOURCE_URL=$sourceUrl" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 2. Download Aseprite source
      # ---------------------------------------------------------
      - name: Download Aseprite source
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "$env:ASEPRITE_SOURCE_URL" `
            -OutFile "Aseprite-source.zip"

          New-Item -ItemType Directory -Force -Path "aseprite" | Out-Null

          Expand-Archive `
            -Path "Aseprite-source.zip" `
            -DestinationPath "aseprite"

          # The release ZIP normally contains a single
          # top-level directory. Move its contents up.
          $dirs = Get-ChildItem "aseprite" -Directory

          if ($dirs.Count -eq 1) {
            $sourceDir = $dirs[0].FullName

            Get-ChildItem $sourceDir -Force |
              Move-Item -Destination "aseprite" -Force

            Remove-Item $sourceDir -Recurse -Force
          }

      # ---------------------------------------------------------
      # 3. Download the correct Skia version
      # ---------------------------------------------------------
      - name: Download Skia
        shell: pwsh
        run: |
          $skiaUrl = "https://github.com/aseprite/skia/releases/download/$env:SKIA_VERSION/Skia-Windows-Release-x64.zip"

          Write-Host "Downloading Skia:"
          Write-Host $skiaUrl

          Invoke-WebRequest `
            -Uri $skiaUrl `
            -OutFile "Skia-Windows-Release-x64.zip"

          New-Item -ItemType Directory -Force -Path "skia" | Out-Null

          Expand-Archive `
            -Path "Skia-Windows-Release-x64.zip" `
            -DestinationPath "skia"

      # ---------------------------------------------------------
      # 4. Install Ninja
      # ---------------------------------------------------------
      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress

      # ---------------------------------------------------------
      # 5. Set up Visual Studio 2022
      # ---------------------------------------------------------
      - name: Set up Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------
      # 6. Configure CMake
      # ---------------------------------------------------------
      - name: Configure CMake
        shell: pwsh
        working-directory: aseprite
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null

          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_POLICY_DEFAULT_CMP0092=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DENABLE_CCACHE=OFF `
            -DOPENSSL_USE_STATIC_LIBS=TRUE `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$env:GITHUB_WORKSPACE\skia" `
            -DSKIA_LIBRARY_DIR="$env:GITHUB_WORKSPACE\skia\out\Release-x64" `
            -DSKIA_OPENGL_LIBRARY=

      # ---------------------------------------------------------
      # 7. Compile Aseprite
      # ---------------------------------------------------------
      - name: Build Aseprite
        shell: pwsh
        working-directory: aseprite
        run: |
          ninja -C build aseprite

      # ---------------------------------------------------------
      # 8. Prepare portable Aseprite folder
      # ---------------------------------------------------------
      - name: Prepare portable build
        shell: pwsh
        working-directory: aseprite
        run: |
          New-Item -ItemType Directory -Force -Path "portable" | Out-Null

          Copy-Item `
            "build\bin\aseprite.exe" `
            "portable\aseprite.exe"

          Copy-Item `
            "build\bin\data" `
            "portable\data" `
            -Recurse

          # This tells Aseprite to behave as a portable application.
          "# This file is here so Aseprite behaves as a portable program" |
            Out-File `
              -FilePath "portable\aseprite.ini" `
              -Encoding ascii

      # ---------------------------------------------------------
      # 9. Create ZIP
      # ---------------------------------------------------------
      - name: Create ZIP
        shell: pwsh
        working-directory: aseprite
        run: |
          $zipName = "Aseprite-$env:ASEPRITE_VERSION-Windows-x64.zip"

          Compress-Archive `
            -Path "portable\*" `
            -DestinationPath $zipName `
            -CompressionLevel Optimal

          Write-Host "Created:"
          Write-Host $zipName

      # ---------------------------------------------------------
      # 10. Upload the compiled Aseprite to GitHub Actions
      # ---------------------------------------------------------
      - name: Upload Aseprite build
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-${{ env.ASEPRITE_VERSION }}
          path: aseprite/Aseprite-${{ env.ASEPRITE_VERSION }}-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
